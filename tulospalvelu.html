<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101820">
<title>Bandylive – Tulospalvelu</title>
<style>
:root{--ink:#101820;--panel:#17232e;--panel2:#202f3a;--accent:#e8c547;--white:#fff;--muted:#bdc7d0;--line:#34434d;--green:#77d49a;--red:#ed7777}
*{box-sizing:border-box}html{background:var(--ink);scroll-behavior:smooth}body{margin:0;background:var(--ink);color:var(--white);font:15px/1.45 Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit}.shell{width:min(1180px,100% - 32px);margin:auto}.top{background:#0b1117;border-bottom:3px solid var(--accent)}.top-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}.brand-mark{width:42px;height:42px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-weight:1000;font-size:21px;clip-path:polygon(0 0,100% 0,100% 75%,75% 100%,0 100%)}.brand-name{font-size:22px;font-weight:1000;letter-spacing:.06em}.brand-sub{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.15em}.top-right{color:var(--muted);font-size:12px;text-align:right}.top-right b{color:var(--accent)}
main{padding:25px 0 50px}.page-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:18px}.eyebrow{color:var(--accent);font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.page-title{margin:3px 0 0;font-size:clamp(25px,4vw,36px);line-height:1.08;font-weight:1000;text-transform:uppercase}.date-control{display:flex;gap:8px;align-items:center}.date-control input{background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:5px;padding:9px 10px;color-scheme:dark}.date-control button,.back,.refresh{border:0;border-radius:5px;background:var(--accent);color:var(--ink);font-weight:900;padding:10px 13px;cursor:pointer}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 13px;color:var(--muted);font-size:12px}.legend{display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}.matches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.match-card{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;padding:13px 14px;color:#fff;cursor:pointer;transition:border-color .15s,transform .15s}.match-card:hover{border-color:var(--accent);transform:translateY(-1px)}.match-card.live{border-left-color:var(--green)}.match-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.competition{font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:900;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.state{font-size:10px;font-weight:900;letter-spacing:.08em;color:var(--muted);white-space:nowrap}.state.live{color:var(--green)}.teams{display:grid;grid-template-columns:minmax(0,1fr) 78px minmax(0,1fr);align-items:center;gap:7px}.team{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}.team.away{justify-content:flex-end;text-align:right}.team-logo{width:34px;height:34px;object-fit:contain;flex:0 0 34px}.team-fallback{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;background:#34434d;color:#e8c547;font-size:10px;font-weight:1000}.team-name{min-width:0;overflow-wrap:anywhere}.score{font-size:26px;font-weight:1000;color:var(--accent);text-align:center;white-space:nowrap}.score.time{font-size:20px}.clock-line{margin-top:4px;text-align:center;color:var(--green);font-size:12px;font-weight:900;min-height:18px}.events-preview{border-top:1px solid rgba(255,255,255,.1);margin-top:11px;padding-top:8px;display:grid;gap:5px}.preview-event{display:grid;grid-template-columns:42px minmax(68px,auto) minmax(0,1fr);gap:8px;font-size:12px;align-items:baseline}.preview-team{color:#bdc7d0;font-size:10px;font-weight:900;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview-time{color:var(--accent);font-weight:900}.preview-text{color:#edf1f4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.no-events{color:#83929d;font-size:11px}.empty,.error{padding:24px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--muted)}.error{border-left:4px solid var(--red);color:#fff;text-align:left}
.detail-head{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:7px;padding:18px;margin-bottom:14px}.detail-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.back{background:var(--panel2);color:#fff;border:1px solid var(--line);text-decoration:none;display:inline-block}.detail-score{display:grid;grid-template-columns:minmax(0,1fr) 120px minmax(0,1fr);gap:12px;align-items:center}.detail-team{font-size:clamp(16px,3vw,24px);font-weight:1000;text-transform:uppercase;overflow-wrap:anywhere}.detail-team:last-child{text-align:right}.detail-result{text-align:center;color:var(--accent);font-size:clamp(30px,6vw,48px);font-weight:1000;line-height:1}.detail-clock{text-align:center;color:var(--green);font-size:15px;font-weight:900;margin-top:8px}.detail-state{text-align:center;color:var(--muted);font-size:11px;font-weight:900;margin-top:3px}.section{background:var(--panel);border:1px solid var(--line);border-radius:7px;margin-top:13px;overflow:hidden}.section-title{padding:12px 14px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:13px;font-weight:1000;letter-spacing:.1em;text-transform:uppercase}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}.stat{background:var(--panel);padding:13px;text-align:center}.stat-value{font-size:25px;font-weight:1000;color:var(--accent)}.stat-label{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.06em;text-transform:uppercase}.event-list{padding:5px 14px}.event{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.09)}.event:last-child{border-bottom:0}.event-minute{font-weight:1000;color:var(--accent);font-size:15px}.event-main{min-width:0}.event-type{font-size:13px;font-weight:1000;text-transform:uppercase}.event-detail{font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}.event-team{font-size:11px;color:var(--muted);text-align:right}.tag{font-size:10px;font-weight:900;padding:4px 6px;border-radius:3px;background:#34434d;color:#fff}.tag.goal{background:var(--accent);color:var(--ink)}.tag.penalty{background:#6d3d3d}.footer{padding:22px 0;color:#74838e;text-align:center;font-size:10px;letter-spacing:.08em}
.hidden{display:none!important}
@media(max-width:700px){.shell{width:min(100% - 20px,560px)}.top-inner{min-height:64px}.brand-mark{width:36px;height:36px}.brand-name{font-size:19px}.top-right{font-size:10px}.page-head{align-items:flex-start;flex-direction:column}.date-control{width:100%}.date-control input{flex:1;min-width:0}.matches{grid-template-columns:1fr;gap:9px}.match-card{padding:11px}.team{font-size:13px;gap:5px}.team-logo,.team-fallback{width:27px;height:27px;flex-basis:27px}.preview-event{grid-template-columns:38px minmax(58px,auto) minmax(0,1fr);gap:6px}.preview-team{font-size:9px}.score{font-size:24px}.detail-head{padding:13px}.detail-score{grid-template-columns:minmax(0,1fr) 82px minmax(0,1fr);gap:6px}.detail-team{font-size:15px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:last-child:nth-child(odd){grid-column:1/-1}.event{grid-template-columns:48px minmax(0,1fr) auto;gap:7px}.event-team{max-width:85px;overflow-wrap:anywhere}}
</style>
</head>
<body>
<header class="top"><div class="shell top-inner"><a class="brand" href="tulospalvelu.html"><span class="brand-mark">B</span><span><span class="brand-name">BANDYLIVE</span><br><span class="brand-sub">TULOSPALVELU</span></span></a><div class="top-right">JÄÄPALLO<br><b id="liveCount">HAETAAN OTTELUITA</b></div></div></header>
<main class="shell">
<section id="listView">
 <div class="page-head"><div><div class="eyebrow">Otteluseuranta</div><h1 class="page-title">Päivän ottelut</h1></div><div class="date-control"><input id="dateInput" type="date"><button id="dateBtn">Näytä</button></div></div>
 <div class="toolbar"><span id="dateLabel">–</span><span class="legend"><i class="dot"></i> Käynnissä</span></div>
 <div id="matches" class="matches"><div class="empty">Haetaan otteluita…</div></div>
</section>
<section id="detailView" class="hidden">
 <div class="detail-actions"><button class="back" id="backBtn">← Päivän ottelut</button><button class="refresh" id="refreshBtn">Päivitä</button></div>
 <div id="detailHeader"></div>
 <section class="section"><div class="section-title">Ottelun tilastot</div><div id="stats" class="stats"></div></section>
 <section class="section"><div class="section-title">Ottelun tapahtumat</div><div id="events" class="event-list"></div></section>
</section>
<div id="error" class="error hidden"></div>
</main>
<footer class="shell footer">BANDYLIVE · TULOSPALVELU · TIEDOT TORNEOPALISTA</footer>
<script>
(()=>{
'use strict';
const q=new URLSearchParams(location.search),$=id=>document.getElementById(id);
const localDate=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Helsinki',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
let date=q.get('pvm')||localDate(), selectedId=q.get('ottelu')||'', latestXml='', refreshTimer=null, busy=false;
const tournament=q.get('turnaus')||'sjpl_2627', refresh=Math.max(3,Math.min(30,Number(q.get('refresh')||5)));
const txt=(n,t)=>n.getElementsByTagName(t)[0]?.textContent?.trim()||'', attr=(n,a)=>String(n.getAttribute(a)||'').trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seconds(v){const s=String(v||'').trim();if(!s)return NaN;let m=s.match(/^(\d+)\+(\d{1,2}):(\d{1,2})$/);if(m)return +m[1]*60 + +m[2]*60 + +m[3];let a=s.split(':').map(Number);if(a.some(x=>!Number.isFinite(x)))return NaN;if(a.length===3)return a[0]*3600+a[1]*60+a[2];if(a.length===2)return a[0]*60+a[1];if(a.length===1)return a[0]*60;return NaN}
function minute(ev,m){let s=seconds(attr(ev,'kulunutaika')||attr(ev,'peliaika'));if(!Number.isFinite(s)){s=seconds(attr(ev,'aika'));if(Number.isFinite(s))s+=(Math.max(1,+attr(ev,'jakso')||1)-1)*(Math.max(1,+txt(m,'eramin')||45))*60}return Number.isFinite(s)?Math.ceil(s/60)+"'":''}
function status(m){const live=(txt(m,'livestatus')||'').toLowerCase(),st=(txt(m,'status')||'').toLowerCase();if(['over','played','finished','ended'].includes(live)||['played','finished','ended'].includes(st))return {label:'LOPPUTULOS',phase:'finished'};if(['live','playing','inprogress','in_progress'].includes(live)||(+txt(m,'livejakso')>0&&txt(m,'kellokay')==='1'))return {label:'KÄYNNISSÄ',phase:'live'};if(live==='paused'||st.includes('pause'))return {label:'TAUKO',phase:'paused'};return {label:'TULOSSA',phase:'upcoming'}}
function clock(m){const p=Math.max(1,+txt(m,'livejakso')||1),len=Math.max(1,+txt(m,'eramin')||45),raw=txt(m,'liveaika')||txt(m,'livekokaika');let s=seconds(raw);if(!Number.isFinite(s))return '';const done=(p-1)*len*60;if(p>1&&s<done)s+=done;return Math.ceil(s/60)+"'"}
function eventItems(m){return [...m.getElementsByTagName('tapahtuma')].map(e=>{const type=attr(e,'tapahtuma').toLowerCase(),tm=minute(e,m),sec=seconds(attr(e,'kulunutaika')||attr(e,'peliaika')||attr(e,'aika'));return {node:e,type,tm,sec:Number.isFinite(sec)?sec:0,team:attr(e,'kvjoukkue')||'',player:attr(e,'pelaajanimi')||[attr(e,'etunimi'),attr(e,'sukunimi')].filter(Boolean).join(' '),detail:attr(e,'selite')||attr(e,'kuvaus')||''}}).sort((a,b)=>a.sec-b.sec)}
function classify(e){if(e.type==='maali')return 'Maali';if(e.type==='laukaus')return 'Laukaus kohti maalia';if(e.type==='laukausohi'||e.type==='ohi')return 'Laukaus ohi';if(e.type==='kulma')return 'Kulmalyönti';if(e.type==='6min')return '6 minuutin rangaistus';if(e.type==='10min')return '10 minuutin rangaistus';if(e.type==='ulosajo')return 'Ulosajo';return e.type.replace(/[_-]/g,' ')||'Tapahtuma'}
function kickoff(m){const fields=['kellonaika','alkamisaika','alkuaika','ottelunalkamisaika','ottelunalku','ottelun_aika','otteluaika','otteluaika_klo','otteluklo','ottelu_klo','klo','aika','starttime','start_time','match_time','time'];let raw='';for(const f of fields){raw=txt(m,f)||attr(m,f);if(raw)break}const mt=raw.match(/(?:^|[T ])(\d{1,2}):(\d{2})(?::\d{2})?/);if(!mt)return '';const h=+mt[1],min=+mt[2];return h<=23&&min<=59?String(h).padStart(2,'0')+':'+String(min).padStart(2,'0'):''}
function teamMarkup(name,logo,away=false){const img=logo&&/^https?:\/\//i.test(logo)?`<img class=\"team-logo\" src=\"${esc(logo)}\" alt=\"\" onerror=\"this.replaceWith(Object.assign(document.createElement('span'),{className:'team-fallback',textContent:'${esc(name.slice(0,2).toUpperCase())}'}))\">`:`<span class=\"team-fallback\">${esc(name.slice(0,2).toUpperCase())}</span>`;return `<div class=\"team ${away?'away':''}\">${away?`<span class=\"team-name\">${esc(name)}</span>${img}`:`${img}<span class=\"team-name\">${esc(name)}</span>`}</div>`}
function card(m){const id=txt(m,'otteluid'),home=txt(m,'kotinimi')||'Koti',away=txt(m,'vierasnimi')||'Vieras',st=status(m),ev=eventItems(m).filter(e=>['maali','6min','10min','ulosajo','laukaus','laukausohi','ohi','kulma'].includes(e.type)).slice(-3).reverse(),hs=txt(m,'kmaali'),as=txt(m,'vmaali'),upcoming=st.phase==='upcoming'&&!(hs!==''&&as!==''),start=kickoff(m),score=upcoming?(start||'–'):(hs||'–')+' – '+(as||'–');
return `<button class=\"match-card ${st.phase==='live'?'live':''}\" data-id=\"${esc(id)}\"><div class=\"match-top\"><span class=\"competition\">${esc(txt(m,'sarjanimi')||txt(m,'turnausnimi')||'JÄÄPALLO')}</span><span class=\"state ${st.phase==='live'?'live':''}\">${st.phase==='live'?'● ':''}${st.label}${upcoming&&start?' · '+esc(start):''}</span></div><div class=\"teams\">${teamMarkup(home,txt(m,'kotilogo'))}<div class=\"score ${upcoming?'time':''}\">${esc(score)}</div>${teamMarkup(away,txt(m,'vieraslogo'),true)}</div><div class=\"clock-line\">${st.phase==='live'?esc(clock(m)||'LIVE'):st.phase==='paused'?'TAUKO':''}</div><div class=\"events-preview\">${ev.length?ev.map(e=>`<div class=\"preview-event\"><span class=\"preview-time\">${esc(e.tm||'–')}</span><span class=\"preview-team\">${esc(sideName(e,m)||'')}</span><span class=\"preview-text\">${esc((e.type==='maali'?'MAALI':classify(e).toUpperCase())+(e.player?' · '+e.player:''))}</span></div>`).join(''):'<div class=\"no-events\">Ei vielä tapahtumia</div>'}</div></button>`}
function showError(s){$('error').textContent=s;$('error').classList.remove('hidden')}function clearError(){$('error').classList.add('hidden')}
async function loadDay(){if(busy)return;busy=true;try{const u=new URL('/api/live',location.origin);u.searchParams.set('pvm',date);u.searchParams.set('turnaus',tournament);const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('Ottelulistan haku epäonnistui (HTTP '+r.status+').');latestXml=await r.text();const doc=new DOMParser().parseFromString(latestXml,'application/xml');if(doc.querySelector('parsererror'))throw Error('TorneoPalin otteluvastausta ei voitu lukea.');const list=[...doc.getElementsByTagName('ottelu')];list.sort((a,b)=>{const sa=status(a).phase,sb=status(b).phase;return (sa==='live'?0:sa==='paused'?1:sa==='upcoming'?2:3)-(sb==='live'?0:sb==='paused'?1:sb==='upcoming'?2:3)});$('matches').innerHTML=list.length?list.map(card).join(''):'<div class="empty">Tälle päivälle ei löytynyt otteluita.</div>';$('liveCount').textContent=list.filter(m=>['live','paused'].includes(status(m).phase)).length+' LIVE-OTTELUA';$('dateLabel').textContent=new Date(date+'T12:00:00').toLocaleDateString('fi-FI',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('dateInput').value=date;clearError();if(selectedId)openMatch(selectedId,false)}catch(e){showError(e.message||String(e))}finally{busy=false}}
function renderDetail(m){const home=txt(m,'kotinimi')||'Koti',away=txt(m,'vierasnimi')||'Vieras',st=status(m),hs=txt(m,'kmaali')||'–',as=txt(m,'vmaali')||'–',ev=eventItems(m).filter(e=>['maali','laukaus','laukausohi','ohi','kulma','6min','10min','ulosajo'].includes(e.type));$('detailHeader').innerHTML=`<div class="detail-head"><div class="detail-score"><div class="detail-team">${esc(home)}</div><div><div class="detail-result">${esc(hs)}–${esc(as)}</div><div class="detail-clock">${st.phase==='live'?esc(clock(m)||'LIVE'):st.phase==='paused'?'TAUKO':''}</div><div class="detail-state">${st.label}</div></div><div class="detail-team">${esc(away)}</div></div></div>`;
const stats={home:{shots:0,on:0,corners:0,penalties:0,minutes:0},away:{shots:0,on:0,corners:0,penalties:0,minutes:0}};for(const e of ev){const side=attr(e.node,'joukkue')===txt(m,'kotijoukkue')?'home':attr(e.node,'joukkue')===txt(m,'vierasjoukkue')?'away':e.team==='koti'?'home':e.team==='vieras'?'away':'';if(!side)continue;if(e.type==='laukaus'||e.type==='laukausohi'||e.type==='ohi')stats[side].shots++;if(e.type==='laukaus')stats[side].on++;if(e.type==='kulma')stats[side].corners++;if(['6min','10min','ulosajo'].includes(e.type))stats[side].penalties++;if(e.type==='6min')stats[side].minutes+=6;if(e.type==='10min')stats[side].minutes+=10}
const statRows=[['Laukaukset','shots'],['Laukaukset kohti maalia','on'],['Kulmalyönnit','corners'],['Rangaistukset','penalties'],['Rangaistusminuutit','minutes']];$('stats').innerHTML=statRows.map(([label,key])=>`<div class="stat"><div class="stat-value">${stats.home[key]} – ${stats.away[key]}</div><div class="stat-label">${label}</div></div>`).join('');
$('events').innerHTML=ev.length?ev.slice().reverse().map(e=>{const typ=classify(e),goal=e.type==='maali',pen=['6min','10min','ulosajo'].includes(e.type);return `<div class="event"><div class="event-minute">${esc(e.tm||'–')}</div><div class="event-main"><div class="event-type">${esc(typ)}</div><div class="event-detail">${esc([e.player,e.detail].filter(Boolean).join(' · ')||'–')}</div></div><div class="event-team">${esc(sideName(e,m))}<br><span class="tag ${goal?'goal':pen?'penalty':''}">${goal?'MAALI':pen?'RANGAISTUS':'TAPAHTUMA'}</span></div></div>`}).join(''):'<div class="empty">Ottelusta ei löytynyt tapahtumamerkintöjä.</div>'}
function openMatch(id,updateUrl=true){const doc=new DOMParser().parseFromString(latestXml,'application/xml');const m=[...doc.getElementsByTagName('ottelu')].find(x=>txt(x,'otteluid')===String(id));if(!m){showError('Ottelua ei löytynyt valitulta päivältä.');return}selectedId=String(id);$('listView').classList.add('hidden');$('detailView').classList.remove('hidden');renderDetail(m);clearError();if(updateUrl){const u=new URL(location.href);u.searchParams.set('pvm',date);u.searchParams.set('ottelu',selectedId);history.pushState({detail:true},'',u)}}
function showList(updateUrl=true){selectedId='';$('detailView').classList.add('hidden');$('listView').classList.remove('hidden');if(updateUrl){const u=new URL(location.href);u.searchParams.delete('ottelu');history.pushState({},'',u)}}
$('matches').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)openMatch(b.dataset.id)});$('dateBtn').addEventListener('click',()=>{date=$('dateInput').value||localDate();selectedId='';showList();loadDay()});$('backBtn').addEventListener('click',()=>showList());$('refreshBtn').addEventListener('click',()=>loadDay());window.addEventListener('popstate',()=>{const u=new URL(location.href),id=u.searchParams.get('ottelu');date=u.searchParams.get('pvm')||date;if(id){selectedId=id;loadDay()}else showList(false)});
loadDay();refreshTimer=setInterval(()=>{if(document.visibilityState==='visible')loadDay()},refresh*1000);
})();
</script>
</body></html>
