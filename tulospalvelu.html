<script>
(()=>{
'use strict';
const navLive=document.querySelector('[data-nav="live"]');if(navLive)navLive.classList.add('active');

const q=new URLSearchParams(location.search),$=id=>document.getElementById(id);
const localDate=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Helsinki',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
let date=q.get('pvm')||localDate(), selectedId=q.get('ottelu')||'', latestXml='', refreshTimer=null, busy=false, allMatches=[], selectedSeries=q.get('sarja')||'all';
const scheduleCache=new Map(), schedulePending=new Map();
const rosterCache=new Map(), rosterPending=new Map();
const eventKeysByMatch=new Map(), newEventUntil=new Map(), newEventFlashUntil=new Map(), newGoalUntil=new Map();
let eventBaselineDate='';
const tournament=q.get('turnaus')||'sjpl_2627', refresh=Math.max(3,Math.min(30,Number(q.get('refresh')||5)));
function syncNavLinks(){for(const a of document.querySelectorAll('.main-nav a')){const u=new URL(a.href);u.searchParams.set('turnaus',tournament);if(selectedSeries!=='all')u.searchParams.set('sarja',selectedSeries);else u.searchParams.delete('sarja');a.href=u.toString()}}syncNavLinks();
const txt=(n,t)=>n.getElementsByTagName(t)[0]?.textContent?.trim()||'', attr=(n,a)=>String(n.getAttribute(a)||'').trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seconds(v){const s=String(v||'').trim();if(!s)return NaN;let m=s.match(/^(\d+)\+(\d{1,2}):(\d{1,2})$/);if(m)return +m[1]*60 + +m[2]*60 + +m[3];let a=s.split(':').map(Number);if(a.some(x=>!Number.isFinite(x)))return NaN;if(a.length===3)return a[0]*3600+a[1]*60+a[2];if(a.length===2)return a[0]*60+a[1];if(a.length===1)return a[0]*60;return NaN}
function minute(ev,m){let s=seconds(attr(ev,'kulunutaika')||attr(ev,'peliaika'));if(!Number.isFinite(s)){s=seconds(attr(ev,'aika'));if(Number.isFinite(s))s+=(Math.max(1,+attr(ev,'jakso')||1)-1)*(Math.max(1,+txt(m,'eramin')||45))*60}return Number.isFinite(s)?Math.ceil(s/60)+"'":''}
function status(m){const live=(txt(m,'livestatus')||'').toLowerCase(),st=(txt(m,'status')||'').toLowerCase();if(['over','played','finished','ended'].includes(live)||['played','finished','ended'].includes(st))return {label:'LOPPUTULOS',phase:'finished'};if(['live','playing','inprogress','in_progress'].includes(live)||(+txt(m,'livejakso')>0&&txt(m,'kellokay')==='1'))return {label:'KÄYNNISSÄ',phase:'live'};if(live==='paused'||st.includes('pause'))return {label:'TAUKO',phase:'paused'};return {label:'TULOSSA',phase:'upcoming'}}
function clock(m){const p=Math.max(1,+txt(m,'livejakso')||1),len=Math.max(1,+txt(m,'eramin')||45),raw=txt(m,'liveaika')||txt(m,'livekokaika');let s=seconds(raw);if(!Number.isFinite(s))return '';const done=(p-1)*len*60;if(p>1&&s<done)s+=done;return Math.ceil(s/60)+"'"}
function eventSide(e,m){const id=attr(e.node,'joukkue'),homeId=txt(m,'kotijoukkue'),awayId=txt(m,'vierasjoukkue');if(id&&homeId&&id===homeId)return 'home';if(id&&awayId&&id===awayId)return 'away';const raw=String(e.team||attr(e.node,'joukkue')||'').trim().toLocaleLowerCase('fi-FI');if(['koti','home','kotijoukkue'].includes(raw))return 'home';if(['vieras','away','vierasjoukkue'].includes(raw))return 'away';const n=normTeam(raw);if(n&&n===normTeam(txt(m,'kotinimi')))return 'home';if(n&&n===normTeam(txt(m,'vierasnimi')))return 'away';if(id&&homeId&&id===homeId)return 'home';if(id&&awayId&&id===awayId)return 'away';return ''}

function openMatch(id,updateUrl=true){const doc=new DOMParser().parseFromString(latestXml,'application/xml');const m=[...doc.getElementsByTagName('ottelu')].find(x=>txt(x,'otteluid')===String(id));if(!m){showError('Ottelua ei löytynyt valitulta päivältä.');return}selectedId=String(id);$('listView').classList.add('hidden');$('detailView').classList.remove('hidden');renderDetail(m);if(!rosterCache.has(selectedId))loadMatchRoster(selectedId,m);clearError();if(updateUrl){const u=new URL(location.href);u.searchParams.set('pvm',date);u.searchParams.set('ottelu',selectedId);history.pushState({detail:true},'',u)}}
function showList(updateUrl=true){selectedId='';$('detailView').classList.add('hidden');$('listView').classList.remove('hidden');if(updateUrl){const u=new URL(location.href);u.searchParams.delete('ottelu');history.pushState({},'',u)}}
$('matches').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)openMatch(b.dataset.id)});$('seriesFilter').addEventListener('change',e=>{selectedSeries=e.target.value;syncNavLinks();renderMatches(allMatches)});$('dateBtn').addEventListener('click',()=>{date=$('dateInput').value||localDate();selectedId='';const u=new URL(location.href);u.searchParams.set('pvm',date);u.searchParams.delete('ottelu');history.pushState({},'',u);showList(false);loadDay()});$('prevGameDay').addEventListener('click',e=>goToGameDay(e.currentTarget.dataset.date));$('nextGameDay').addEventListener('click',e=>goToGameDay(e.currentTarget.dataset.date));$('dateInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('dateBtn').click()});$('backBtn').addEventListener('click',()=>showList());$('refreshBtn').addEventListener('click',()=>loadDay());window.addEventListener('popstate',()=>{const u=new URL(location.href),id=u.searchParams.get('ottelu');date=u.searchParams.get('pvm')||date;if(id){selectedId=id;loadDay()}else showList(false)});
loadDay();refreshTimer=setInterval(()=>{if(document.visibilityState==='visible')loadDay()},refresh*1000);
})();
</script>
</body></html>
