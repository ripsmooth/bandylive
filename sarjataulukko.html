<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jääpallo · Bandyliigan sarjataulukko</title>
<style>
:root{--ink:#101820;--panel:#17232e;--panel2:#1b2a35;--accent:#e8c547;--white:#fff;--muted:#bdc7d0;--width:1120px;--scale:1}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;color:var(--white);font-variant-numeric:tabular-nums}.wrap{position:absolute;left:50%;top:50%;width:var(--width);max-width:calc(100vw - 20px);transform:translate(-50%,-50%) scale(var(--scale));transform-origin:center center;filter:drop-shadow(0 4px 12px #0005)}.header{height:88px;background:rgba(16,24,32,.98);border-bottom:4px solid var(--accent);display:grid;grid-template-columns:1fr 270px 1fr;align-items:stretch}.brand{display:flex;align-items:center;padding:0 24px;font-size:clamp(20px,2.2vw,32px);font-weight:900;letter-spacing:.035em;text-transform:uppercase}.season{display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--ink);font-size:24px;font-weight:900;text-transform:uppercase;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}.meta{display:flex;align-items:center;justify-content:flex-end;padding:0 24px;color:var(--muted);font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.tablebox{margin-top:10px;background:rgba(16,24,32,.98);border-top:3px solid var(--accent);padding-bottom:4px}table{width:100%;border-collapse:collapse;table-layout:fixed}thead{background:var(--panel2)}th{height:45px;padding:8px 9px;color:var(--accent);font-size:14px;letter-spacing:.06em;text-transform:uppercase;text-align:center;font-weight:900}th:nth-child(2){text-align:left;padding-left:18px}td{height:39px;padding:6px 9px;border-bottom:1px solid #34434d;text-align:center;font-size:18px;font-weight:700}tbody tr:nth-child(odd){background:#17232e}tbody tr:nth-child(even){background:#121c24}td:first-child{color:var(--accent);font-size:19px;font-weight:900}td:nth-child(2){text-align:left;padding-left:18px;font-size:19px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.teamcell{display:flex;align-items:center;gap:10px;min-width:0}.teamname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.points{color:var(--accent);font-size:22px;font-weight:900}.goals{white-space:nowrap}.status{display:flex;justify-content:space-between;padding:8px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.error{background:rgba(16,24,32,.97);border-left:4px solid var(--accent);padding:12px 14px;font-size:14px;color:#fff}.hidden{display:none!important}
@media(max-width:800px){.header{height:64px;grid-template-columns:1fr 150px 1fr}.brand{font-size:16px;padding:0 10px}.season{font-size:16px}.meta{font-size:10px;padding:0 10px}th{font-size:10px;padding:5px 3px;height:32px}td{font-size:13px;padding:4px 3px;height:30px}td:nth-child(2){font-size:13px;padding-left:7px}.points{font-size:15px}.status{font-size:8px}}
</style></head><body>
<div class="wrap" id="wrap"><div class="header"><div class="brand">BANDYLIIGA</div><div class="season">SARJATAULUKKO</div><div class="meta" id="seasonMeta">KAUSI 2026–2027</div></div><div class="tablebox"><table aria-label="Bandyliigan sarjataulukko"><thead><tr><th style="width:6%">SIJ.</th><th style="width:32%">JOUKKUE</th><th style="width:7%">O</th><th style="width:7%">V</th><th style="width:7%">T</th><th style="width:7%">H</th><th style="width:14%">MAALIT</th><th style="width:8%">ME</th><th style="width:12%">P</th></tr></thead><tbody id="rows"><tr><td colspan="9">Haetaan sarjataulukkoa…</td></tr></tbody></table></div><div class="status"><span>JÄÄPALLO · MIESTEN BANDYLIIGA</span><span id="updated">HAETAAN SARJATIETOJA</span></div><div id="err" class="error hidden"></div></div>
<script>(()=>{const q=new URLSearchParams(location.search),$=id=>document.getElementById(id);const turnaus=q.get('turnaus')||'sjpl_2627',sarja=q.get('sarja')||'MBL',refresh=Math.max(5,Math.min(300,Number(q.get('refresh')||30)));const num=s=>{const m=String(s||'').replace(/\s/g,'').match(/-?\d+(?:[.,]\d+)?/);return m?Number(m[0].replace(',','.')):null};const clean=s=>String(s||'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();function findTable(doc){const tables=[...doc.querySelectorAll('table')];let best=null,bestScore=-1;for(const t of tables){const text=clean(t.innerText||t.textContent).toLowerCase();const rows=[...t.querySelectorAll('tr')].map(cells);const hasTeamHeader=rows.some(c=>c.some(x=>/^joukkue$/i.test(x)));const hasCompactStats=rows.some(c=>c.some(x=>/^o$/i.test(x))&&c.some(x=>/^v$/i.test(x))&&c.some(x=>/^p$/i.test(x)));const knownTeams=(text.match(/akilles|botnia|hifk|jps|kampparit|narukerä|ols|veiterä|wp\s*35/gi)||[]).length;const score=(hasTeamHeader?5:0)+(hasCompactStats?5:0)+Math.min(knownTeams,9)+(t.querySelectorAll('tr').length>3?1:0);if(score>bestScore){best=t;bestScore=score}}return bestScore>=7?best:null}function cells(row){return [...row.querySelectorAll(':scope > th, :scope > td')].map(c=>clean(c.innerText||c.textContent))}function parseTable(table){const trs=[...table.querySelectorAll('tr')];const rows=trs.map(tr=>({tr,c:cells(tr)}));const headRow=rows.find(x=>x.c.some(v=>/^joukkue$/i.test(v))&&x.c.some(v=>/^o$/i.test(v))&&x.c.some(v=>/^p$/i.test(v)));const heads=headRow?headRow.c.map(x=>x.toLowerCase()):[];const ix={rank:0,team:heads.findIndex(h=>/^joukkue$/.test(h)),played:heads.findIndex(h=>/^o$|ottelut|pelatut/.test(h)),wins:heads.findIndex(h=>/^v$|voit/.test(h)),draws:heads.findIndex(h=>/^t$|tasap/.test(h)),losses:heads.findIndex(h=>/^h$|hävi|tapp/.test(h)),goals:heads.findIndex(h=>/^m$|maalit|maalit\s*\(.*\)/.test(h)),diff:heads.findIndex(h=>/maaliero|\+\/-|ero/.test(h)),points:heads.findIndex(h=>/^p$|piste/.test(h))};if(ix.team<0)ix.team=1;if(ix.played<0)ix.played=2;if(ix.wins<0)ix.wins=3;if(ix.draws<0)ix.draws=4;if(ix.losses<0)ix.losses=5;if(ix.goals<0)ix.goals=6;if(ix.points<0)ix.points=heads.length-1;const out=[];for(const item of rows){if(item.tr===headRow)continue;const cs=item.c;if(cs.length<5)continue;const joined=cs.join(' ');if(!/akilles|botnia|hifk|jps|kampparit|narukerä|ols|veiterä|wp\s*35/i.test(joined))continue;let teamIndex=ix.team;let team=cs[teamIndex]||'';let rank=num(cs[0]);/* TorneoPalin joukkueen logolle on usein oma tyhjä solunsa sijoituksen ja nimen välissä. */if(!/akilles|botnia|hifk|jps|kampparit|narukerä|ols|veiterä|wp\s*35/i.test(team)){const found=cs.findIndex((v,i)=>i>0&&/akilles|botnia|hifk|jps|kampparit|narukerä|ols|veiterä|wp\s*35/i.test(v));if(found>=0){teamIndex=found;team=cs[found]}}if(!team)continue;const offset=teamIndex===2?1:0;const get=(idx, fallback)=>{let pos=idx;if(pos<0)pos=fallback;/* Otsakerivi ei sisällä logon solua, datarivillä se voi olla mukana. */if(teamIndex===2&&pos>=1)pos++;return cs[pos]??''};const played=num(get(ix.played,3));const points=num(get(ix.points,8));const goals=get(ix.goals,7);const diff=ix.diff>=0?get(ix.diff,8):'';out.push({rank:rank??out.length+1,team,played:played===null?'—':played,wins:get(ix.wins,4)||'—',draws:get(ix.draws,5)||'—',losses:get(ix.losses,6)||'—',goals:goals||'—',diff:diff||'—',points:points===null?(get(ix.points,8)||'—'):points});}return out}function render(data){$('rows').innerHTML='';for(const r of data){const tr=document.createElement('tr');const values=[r.rank,r.team,r.played,r.wins,r.draws,r.losses,r.goals,r.diff,r.points];values.forEach((v,i)=>{const td=document.createElement('td');if(i===1){const d=document.createElement('div');d.className='teamcell';const n=document.createElement('span');n.className='teamname';n.textContent=v;d.append(n);td.append(d)}else{td.textContent=v;if(i===8)td.className='points';if(i===6)td.className='goals'}tr.append(td)});$('rows').append(tr)}if(!data.length)throw Error('Sarjataulukkoa ei tunnistettu TorneoPalin sivulta. Tarkista sarjan HTML-rakenne.');fit()}function fit(){const wrap=$('wrap');wrap.style.setProperty('--width',Math.max(600,Math.min(1120,Number(q.get('width')||1120)))+'px');const maxH=innerHeight-16;wrap.style.setProperty('--scale','1');const rect=wrap.getBoundingClientRect();const naturalW=wrap.offsetWidth,naturalH=wrap.offsetHeight;let scale=Math.min(1,(innerWidth-16)/naturalW,maxH/naturalH);if(q.has('scale'))scale=Math.min(2,Math.max(.3,Number(q.get('scale'))/100||1));wrap.style.setProperty('--scale',String(scale));}async function update(){try{const u=new URL('/api/standings',location.origin);u.searchParams.set('turnaus',turnaus);u.searchParams.set('sarja',sarja);const r=await fetch(q.get('api')||u.toString(),{cache:'no-store'});const body=await r.text();if(!r.ok)throw Error('TorneoPal vastasi '+r.status+(body?': '+clean(body).slice(0,160):''));const doc=new DOMParser().parseFromString(body,'text/html');const table=findTable(doc);if(!table)throw Error('TorneoPalin vastauksesta ei löytynyt sarjataulukkoa.');const rows=parseTable(table);render(rows);$('updated').textContent='PÄIVITETTY '+new Date().toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('err').classList.add('hidden')}catch(e){$('err').textContent='TorneoPal: '+e.message;$('err').classList.remove('hidden')}}function debug(){if(q.get('debug')!=='1')return;const p=document.createElement('div');p.id='bandylive-debug-panel';p.style.cssText='position:fixed;z-index:2147483647;left:8px;top:8px;max-width:min(460px,calc(100vw - 16px));max-height:45vh;overflow:auto;padding:10px 12px;background:rgba(5,10,15,.94);color:#fff;border:1px solid #e8c547;border-radius:6px;font:12px/1.45 Arial,sans-serif;box-shadow:0 4px 20px #0008';p.innerHTML='<b style="color:#e8c547">BANDYLIVE DEBUG · SARJATAULUKKO</b><div id="debugValues" style="margin-top:6px"></div>';document.body.append(p);const f=n=>Math.round(n*100)/100;function up(){const e=$('wrap'),r=e.getBoundingClientRect(),c=getComputedStyle(e);$('debugValues').innerHTML=[['Elementti',r.width+' × '+r.height+' px'],['Sijainti','x '+f(r.left)+' / y '+f(r.top)],['CSS width',c.width],['Ikkuna',innerWidth+' × '+innerHeight+' px'],['Skaala',c.transform],['Päivitysväli',refresh+' s'],['URL',location.search]].map(([a,b])=>'<div style="display:flex;justify-content:space-between;gap:12px;border-top:1px solid #ffffff20;padding:3px 0"><span style="color:#bdc7d0">'+a+'</span><b style="text-align:right;overflow-wrap:anywhere">'+String(b).replace(/</g,'&lt;')+'</b></div>').join('')}up();addEventListener('resize',up);setInterval(up,1000)}debug();update();setInterval(update,refresh*1000);addEventListener('resize',fit);})();</script></body></html>
