<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TorneoPal • Simple Scorebug</title>
<style>
:root{--ink:#101820;--panel:#17232e;--accent:#e8c547;--white:#fff;--muted:#bdc7d0;--scale:1}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:var(--white);font-variant-numeric:tabular-nums}
.wrap{padding:8px;width:max-content;max-width:100vw;transform:scale(var(--scale));transform-origin:top left}
.bug{display:flex;align-items:stretch;height:54px;min-width:410px;max-width:calc(100vw - 16px);filter:drop-shadow(0 3px 5px rgba(0,0,0,.24))}
.block{display:flex;align-items:center;min-width:0;background:rgba(16,24,32,.96)}
.team{gap:9px;padding:0 15px;flex:1}
.team.home{clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);padding-right:23px}
.team.away{clip-path:polygon(12px 0,100% 0,100% 100%,0 100%);padding-left:23px;flex-direction:row-reverse;text-align:right}
.teamname{font-size:17px;font-weight:800;letter-spacing:.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.logo{width:27px;height:27px;object-fit:contain;flex:0 0 27px}
.fallback{width:27px;height:27px;flex:0 0 27px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;border:1px solid rgba(255,255,255,.55);border-radius:50%;color:var(--accent)}
.center{background:var(--accent);color:var(--ink);padding:0 15px;display:flex;align-items:center;justify-content:center;gap:10px;min-width:104px;z-index:1}
.score{font-size:25px;font-weight:900;line-height:1;display:flex;align-items:center;gap:7px;white-space:nowrap}
.dash{font-size:17px;font-weight:600}
.clock{background:var(--panel);color:#fff;display:flex;align-items:center;justify-content:center;min-width:66px;padding:0 10px;font-size:14px;font-weight:800;white-space:nowrap}
.period{position:absolute;left:-9999px}
.foot{font-size:9px;line-height:1.2;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:4px 2px 0;display:flex;justify-content:space-between;gap:12px}
.foot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err{font-size:12px;background:rgba(16,24,32,.95);border-left:4px solid #e8c547;color:#fff;padding:10px 12px;max-width:520px}
.hidden{display:none!important}
@media(max-width:500px){.bug{min-width:0;height:46px}.team{padding:0 8px;gap:5px}.team.home{padding-right:15px}.team.away{padding-left:15px}.teamname{font-size:12px}.logo,.fallback{width:21px;height:21px;flex-basis:21px}.center{min-width:82px;padding:0 8px;gap:6px}.score{font-size:20px;gap:4px}.clock{min-width:52px;font-size:12px;padding:0 6px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bug hidden" id="bug">
    <div class="block team home">
      <div id="homeLogo" class="fallback">K</div>
      <div class="teamname" id="homeName">KOTI</div>
    </div>
    <div class="block center">
      <div class="score"><span id="homeScore">0</span><span class="dash">–</span><span id="awayScore">0</span></div>
    </div>
    <div class="block team away">
      <div id="awayLogo" class="fallback">V</div>
      <div class="teamname" id="awayName">VIERAS</div>
    </div>
    <div class="block clock" id="clock">—</div>
  </div>
  <div class="foot hidden" id="foot"><span id="periodStatus">JÄÄPALLO · LIVE</span><span id="updated"></span></div>
  <div class="err" id="err">TorneoPal: haetaan ottelutietoja…</div>
</div>
<script>
(() => {
 const q=new URLSearchParams(location.search);
 const localDate=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Helsinki',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 const date=q.get('pvm')||localDate, tournament=q.get('turnaus')||'sjpl_2627';
 const matchId=q.get('ottelu')||q.get('match')||'';
 document.documentElement.style.setProperty('--scale',Math.max(.5,Math.min(2.5,Number(q.get('scale')||1))));
 const refresh=Math.max(3,Math.min(60,Number(q.get('refresh')||5)));
 const $=id=>document.getElementById(id), val=(n,t)=>(n.getElementsByTagName(t)[0]?.textContent||'').trim();
 function set(id,v){$(id).textContent=v==null?'':String(v)}
 function setLogo(id,url,name){
  const el=$(id);el.innerHTML='';
  if(url&&/^https?:\/\//i.test(url)){const im=document.createElement('img');im.className='logo';im.alt='';im.src=url;im.onerror=()=>{el.className='fallback';el.textContent=(name||'?').slice(0,2).toUpperCase()};el.className='';el.appendChild(im)}
  else{el.className='fallback';el.textContent=(name||'?').slice(0,2).toUpperCase()}
 }
 function fail(message){$('err').textContent='TorneoPal: '+message;$('err').classList.remove('hidden');$('bug').classList.add('hidden');$('foot').classList.add('hidden')}
 function render(xml){
  const d=new DOMParser().parseFromString(xml,'application/xml');
  if(d.querySelector('parsererror'))throw Error('XML-dataa ei voitu lukea.');
  const matches=[...d.getElementsByTagName('ottelu')];if(!matches.length)throw Error('Otteluita ei löytynyt valitulta päivältä.');
  let m=matchId?matches.find(x=>val(x,'otteluid')===matchId):null;
  if(matchId&&!m)throw Error('Ottelua '+matchId+' ei löytynyt.');
  if(!m)m=matches.find(x=>{const s=val(x,'livestatus').toLowerCase();return s&&!['over','played','finished','ended'].includes(s)})||matches[0];
  const hn=val(m,'kotinimi')||'KOTI', an=val(m,'vierasnimi')||'VIERAS';
  set('homeName',hn);set('awayName',an);set('homeScore',val(m,'kmaali')||'0');set('awayScore',val(m,'vmaali')||'0');
  setLogo('homeLogo',val(m,'kotilogo'),hn);setLogo('awayLogo',val(m,'vieraslogo'),an);
  const raw=(val(m,'livestatus')||val(m,'status')).toLowerCase(), period=val(m,'livejakso'), clock=val(m,'liveaika');
  const done=['over','played','finished','ended'].includes(raw);
  set('clock',clock||(done?'LOPPU':'—'));
  set('periodStatus',`${period?period+'. JAKSO · ':''}${done?'LOPPUTULOS':(['live','playing'].includes(raw)?'LIVE':(val(m,'status')||'OTTELU'))} · ${val(m,'turnausnimi')||tournament}`);
  set('updated','PÄIVITETTY '+new Date().toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit'}));
  $('err').classList.add('hidden');$('bug').classList.remove('hidden');$('foot').classList.remove('hidden');
 }
 async function refreshData(){
  try{
   const url=new URL('/api/live',location.origin);url.searchParams.set('pvm',date);url.searchParams.set('turnaus',tournament);
   const r=await fetch(q.get('api')||url.toString(),{cache:'no-store'});if(!r.ok)throw Error('palvelin vastasi '+r.status);
   render(await r.text());
  }catch(e){fail('tietoja ei saatu. '+e.message+' Tarkista Vercel-julkaisu ja TorneoPal-yhteys.')}
 }
 refreshData();setInterval(refreshData,refresh*1000);
})();
</script>
</body>
</html>
